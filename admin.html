<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b2314">
<title>Barakah eMart — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--br:#3b2314;--br2:#5a3820;--gold:#c8962a;--gl:#e6b84a;--cr:#faf3e3;--ln:#eadfc9;--gr:#4a7c3f;--red:#c0392b;--mu:#7a6a5c;--tx:#2b1b10}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#f6f1e7;color:var(--tx);font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:14px}button{cursor:pointer}.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#24150b,var(--br2))}
.lbox{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:360px}
.lbox h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--br)}.lbox p{color:var(--mu);font-size:13px;margin:4px 0 14px}
.lbox label,.fld label{display:block;font-weight:800;font-size:12px;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid var(--ln);border-radius:8px;outline:none;background:#fff}input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.lbox button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:8px;background:var(--br);color:#fff;font-weight:800}
.err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:16px}
.top{position:sticky;top:0;z-index:50;background:var(--br);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
.top b{font-family:'Playfair Display',serif;font-size:17px;flex:1}.top button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px}.top .add{background:var(--gold);color:var(--br);font-weight:900}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px}.st b{display:block;font-size:24px;color:var(--br);font-family:'Playfair Display',serif}.st span{font-size:11px;color:var(--mu);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1.5px solid var(--ln);background:#fff;border-radius:9px;font-weight:800;color:var(--mu)}.tabs button.on{background:var(--br);border-color:var(--br);color:#fff}
.pc{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:10px}.pc.off{opacity:.6}
.pc>img,.pc>.ph{width:70px;height:70px;object-fit:cover;background:var(--cr);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:14px;color:var(--br)}.pi small{color:var(--mu);font-size:11px;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 6px}.pg label{font-size:10px;font-weight:800;color:var(--mu);display:block;margin-bottom:2px}.pg input{padding:7px;font-weight:800}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{background:#fff;border:1.5px solid var(--ln);border-radius:7px;padding:6px 9px;font-size:11px;font-weight:800}.acts .sv{background:var(--br);color:#fff;border-color:var(--br)}.acts .del{color:var(--red);border-color:#f0c9c4}
.box{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row input{flex:1}.row button{background:var(--br);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:800;white-space:nowrap}.row .del{background:#fff;color:var(--red);border:1.5px solid #f0c9c4}
.empty{background:#fff;border:1.5px dashed var(--ln);border-radius:12px;padding:26px;text-align:center;color:var(--mu)}.empty button{margin-top:10px;background:var(--br);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:580px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}@media(min-width:600px){.ov{align-items:center}.md{border-radius:16px}}
.md h2{font-family:'Playfair Display',serif;color:var(--br);margin-bottom:8px}.fld{margin-bottom:8px}.fld small{display:block;color:var(--mu);font-size:11px;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.im{position:relative;width:68px;height:68px;border:1.5px solid var(--ln);border-radius:8px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.im button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:11px}
.upl{display:inline-block;border:1.5px dashed var(--gold);color:var(--br);border-radius:8px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer}
.chk{display:flex;gap:16px;margin:8px 0}.chk label{display:flex;align-items:center;gap:6px;font-weight:700;margin:0}.chk input{width:auto}
.mact{display:flex;gap:8px;position:sticky;bottom:-16px;background:#fff;padding:10px 0 4px}.mact button{flex:1;padding:12px;border-radius:9px;border:none;font-weight:900}.mact .sv{background:var(--br);color:#fff}.mact .cn{background:#eee8dc}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:var(--br);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="login"><div class="lbox">
  <h1>Barakah eMart Admin</h1><p>Sirf owner ke liye.</p>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="loginBtn">Login</button><div class="err" id="lerr"></div>
</div></div>

<div id="app" class="hide">
  <div class="top"><b>🌴 Barakah Admin</b><button class="add" id="addBtn">+ Product</button><button id="outBtn">Logout</button></div>
  <div class="wrap">
    <div class="stats">
      <div class="st"><b id="s1">0</b><span>Total Products</span></div>
      <div class="st"><b id="s2">0</b><span>In Stock</span></div>
      <div class="st"><b id="s3">0</b><span>Out of Stock</span></div>
      <div class="st"><b id="s4">0</b><span>Hidden</span></div>
    </div>
    <div class="tabs"><button class="on" data-t="p">Products</button><button data-t="c">Categories</button><button data-t="s">Settings</button></div>
    <div id="tp"></div><div id="tc" class="hide"></div><div id="ts" class="hide"></div>
    <p style="text-align:center;margin:14px 0"><a href="index.html" target="_blank" rel="noopener" style="color:var(--br);font-weight:800">Website dekho ↗</a></p>
  </div>
</div>

<div class="ov hide" id="ov"><div class="md">
  <h2 id="mt">New Product</h2>
  <div class="fld"><label>Product name</label><input id="f-name" placeholder="e.g. Ajwa Dates Premium"></div>
  <div class="fld"><label>Category</label><select id="f-cat"></select></div>
  <div class="fld"><label>Short description</label><textarea id="f-desc" rows="3"></textarea></div>
  <div class="fld"><label>Price per pack size (₹)</label>
    <div class="g3"><div><small>250g</small><input id="f-p250" type="number" inputmode="numeric" min="0"></div><div><small>500g</small><input id="f-p500" type="number" inputmode="numeric" min="0"></div><div><small>1kg</small><input id="f-p1" type="number" inputmode="numeric" min="0"></div></div>
    <small>Jo size nahi bechna usse khali chhodo.</small></div>
  <div class="fld"><label>Stock quantity (packs)</label><input id="f-stock" type="number" inputmode="numeric" min="0"><small>0 = Out of Stock. Khali = stock limit nahi.</small></div>
  <div class="fld"><label>Product details (sirf wahi bharo jo verified ho)</label>
    <div class="g2"><input id="f-origin" placeholder="Country of origin"><input id="f-variety" placeholder="Variety"><input id="f-texture" placeholder="Texture"><input id="f-taste" placeholder="Taste"></div>
    <input id="f-storage" placeholder="Storage instructions" style="margin-top:8px"></div>
  <div class="fld"><label>Photos (max 4)</label><div class="imgs" id="imgs"></div><label class="upl">📷 Photo choose karo<input type="file" id="file" accept="image/*" multiple hidden></label></div>
  <div class="chk"><label><input type="checkbox" id="f-active" checked> Website par dikhao</label></div>
  <div class="mact"><button class="cn" id="cancelBtn">Cancel</button><button class="sv" id="saveBtn">Save product</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import {firebaseConfig,isConfigured} from './firebase-config.js';
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,setDoc,updateDoc,deleteDoc,doc,getDoc,query,orderBy,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
if(!isConfigured){$('login').innerHTML='<div class="lbox"><h1>Setup baaki hai</h1><p>firebase-config.js me Firebase keys paste karo.</p></div>';throw new Error('not configured')}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const PC=collection(db,'products'),CC=collection(db,'categories');
const DEF_CATS=['AJWA DATES','KALMI DATES (SAFAWI)','MEDJOOL DATES'];
let prods=[],legacy=0,cats=[],editId=null,fimgs=[];

/* auth */
async function doLogin(){$('lerr').textContent='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){$('lerr').textContent='Email ya password galat hai.'}}
$('loginBtn').onclick=doLogin;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('outBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('login').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);if(u)load()});

/* tabs */
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['p','c','s'].forEach(t=>$('t'+t).classList.toggle('hide',t!==b.dataset.t));$('addBtn').classList.toggle('hide',b.dataset.t!=='p')});

/* load */
async function load(){
  try{
    const [ps,cs,st]=await Promise.all([getDocs(query(PC,orderBy('order'))),getDocs(query(CC,orderBy('order'))).catch(()=>null),getDoc(doc(db,'settings','store')).catch(()=>null)]);
    const all=ps.docs.map(d=>({id:d.id,...d.data()}));
    prods=all.filter(p=>p.prices);legacy=all.length-prods.length;
    cats=cs?cs.docs.map(d=>({id:d.id,...d.data()})):[];
    renderP();renderC();renderS(st&&st.exists()?st.data():{});
    if(!cs||!st){const w='<div class="empty" style="margin-bottom:10px;border-color:#c0392b;color:#c0392b">Categories/Settings load nahi hue. Firebase Rules update karo (products, categories, settings teeno ka read allow hona chahiye).</div>';$('tc').insertAdjacentHTML('afterbegin',w);$('ts').insertAdjacentHTML('afterbegin',w)}
  }catch(e){$('tp').innerHTML='<div class="empty">Load error: '+esc(e.message)+'<br>Firestore rules check karo.</div>'}
}
const stockN=p=>p.stock===undefined||p.stock===null?null:p.stock;
function renderP(){
  $('s1').textContent=prods.length;
  $('s2').textContent=prods.filter(p=>p.active!==false&&(stockN(p)===null||stockN(p)>0)).length;
  $('s3').textContent=prods.filter(p=>stockN(p)!==null&&stockN(p)<=0).length;
  $('s4').textContent=prods.filter(p=>p.active===false).length;
  if(!prods.length){$('tp').innerHTML='<div class="empty">Abhi koi dates product nahi hai.<br>Upar "+ Product" dabao.'+(legacy?'<br><small>'+legacy+' purane products database me hain, wo store par nahi dikhte.</small>':'')+'</div>';return}
  $('tp').innerHTML=prods.map((p,i)=>`<div class="pc ${p.active===false?'off':''}">${(p.images||[])[0]?`<img src="${esc(p.images[0])}" alt="">`:'<div class="ph">🌴</div>'}
  <div class="pi"><b>${esc(p.name)}</b><small>${esc(p.category||'No category')}${p.active===false?' · Hidden':''}</small>
  <div class="pg">${[['250g','250'],['500g','500'],['1kg','1']].map(([k,x])=>`<div><label>${k} ₹</label><input type="number" inputmode="numeric" id="q${x}-${p.id}" value="${(p.prices||{})[k]||''}"></div>`).join('')}<div><label>Stock</label><input type="number" inputmode="numeric" id="qs-${p.id}" value="${stockN(p)??''}"></div></div>
  <div class="acts"><button class="sv" data-a="q" data-id="${p.id}">Save prices & stock</button><button data-a="e" data-id="${p.id}">✏️ Edit</button><button data-a="v" data-id="${p.id}">${p.active===false?'👁 Show':'🙈 Hide'}</button><button data-a="u" data-i="${i}" ${i===0?'disabled':''}>↑</button><button data-a="d" data-i="${i}" ${i===prods.length-1?'disabled':''}>↓</button><button class="del" data-a="x" data-id="${p.id}">🗑</button></div></div></div>`).join('');
}
$('tp').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,p=prods.find(x=>x.id===id);
  try{
    if(a==='q'){
      const n=x=>{const v=parseFloat($(x+'-'+id).value);return v>0?v:0};
      const prices={'250g':n('q250'),'500g':n('q500'),'1kg':n('q1')};
      if(!prices['250g']&&!prices['500g']&&!prices['1kg']){toast('Kam se kam ek price daalo');return}
      const sv=$('qs-'+id).value.trim();const stock=sv===''?null:Math.max(0,parseInt(sv));
      await updateDoc(doc(db,'products',id),{prices,stock});p.prices=prices;p.stock=stock;renderP();toast('✅ Updated');
    }else if(a==='e')openForm(p);
    else if(a==='v'){await updateDoc(doc(db,'products',id),{active:p.active===false});p.active=p.active===false;renderP()}
    else if(a==='x'){if(confirm('"'+p.name+'" delete kar dein?')){await deleteDoc(doc(db,'products',id));prods=prods.filter(x=>x.id!==id);renderP();toast('Deleted')}}
    else if(a==='u'||a==='d'){const i=+b.dataset.i,j=a==='u'?i-1:i+1,A=prods[i],B=prods[j],bt=writeBatch(db);
      bt.update(doc(db,'products',A.id),{order:B.order});bt.update(doc(db,'products',B.id),{order:A.order});await bt.commit();
      const t=A.order;A.order=B.order;B.order=t;prods.sort((x,y)=>x.order-y.order);renderP()}
  }catch(err){toast('Error: '+err.message)}
});

/* categories */
function renderC(){
  $('tc').innerHTML=(cats.length?'':'<div class="empty">Categories abhi set nahi hain.<br><button id="seedC">3 default categories banao</button></div>')+
  `<div class="box">${cats.map((c,i)=>`<div class="row"><input id="cn-${c.id}" value="${esc(c.name)}"><button data-c="s" data-id="${c.id}">Save</button><button class="del" data-c="x" data-id="${c.id}">🗑</button></div>`).join('')}
  <div class="row" style="margin-top:10px"><input id="newCat" placeholder="Nayi category (e.g. ALMONDS)"><button id="addCat">+ Add</button></div>
  <small style="color:var(--mu)">Category ka naam badalne par us category ke purane products ko edit karke nayi category dobara chunni hogi.</small></div>`;
  const s=$('seedC');if(s)s.onclick=async()=>{const bt=writeBatch(db);DEF_CATS.forEach((n,i)=>bt.set(doc(CC),{name:n,order:i+1}));await bt.commit();toast('Ho gaya');load()};
}
$('tc').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  try{
    if(b.id==='addCat'){const n=$('newCat').value.trim().toUpperCase();if(!n)return;await addDoc(CC,{name:n,order:cats.length?Math.max(...cats.map(c=>c.order||0))+1:1});toast('Category add ho gayi');load()}
    else if(b.dataset.c==='s'){const n=$('cn-'+b.dataset.id).value.trim().toUpperCase();if(!n)return;await updateDoc(doc(db,'categories',b.dataset.id),{name:n});toast('Saved');load()}
    else if(b.dataset.c==='x'){if(confirm('Ye category delete karein? Products delete nahi honge.')){await deleteDoc(doc(db,'categories',b.dataset.id));load()}}
  }catch(err){toast('Error: '+err.message)}
});

/* settings */
function renderS(s){
  $('ts').innerHTML=`<div class="box"><div class="fld"><label>WhatsApp number (country code ke saath)</label><input id="s-wa" value="${esc(s.whatsapp||'919124646598')}" inputmode="numeric"></div>
  <div class="g2"><div class="fld"><label>Delivery charge ₹</label><input id="s-del" type="number" inputmode="numeric" min="0" value="${s.delivery??''}"><small>Khali = WhatsApp par confirm hoga</small></div>
  <div class="fld"><label>Free delivery above ₹</label><input id="s-free" type="number" inputmode="numeric" min="0" value="${s.freeAbove||''}"><small>Optional</small></div></div>
  <div class="mact" style="position:static"><button class="sv" id="saveS">Save settings</button></div></div>`;
  $('saveS').onclick=async()=>{
    const d=$('s-del').value.trim(),f=$('s-free').value.trim();
    try{await setDoc(doc(db,'settings','store'),{whatsapp:$('s-wa').value.replace(/\D/g,''),delivery:d===''?null:Math.max(0,+d),freeAbove:f===''?null:Math.max(0,+f)});toast('✅ Settings saved')}catch(err){toast('Error: '+err.message)}};
}

/* product form */
function openForm(p){
  editId=p?p.id:null;$('mt').textContent=p?'Edit Product':'New Product';
  const names=cats.length?cats.map(c=>c.name):DEF_CATS;
  $('f-cat').innerHTML=names.map(n=>`<option ${p&&p.category===n?'selected':''}>${esc(n)}</option>`).join('');
  const v=(id,x)=>$(id).value=x??'';
  v('f-name',p?.name);v('f-desc',p?.desc);v('f-p250',p?.prices?.['250g']||'');v('f-p500',p?.prices?.['500g']||'');v('f-p1',p?.prices?.['1kg']||'');
  v('f-stock',p?stockN(p):'');v('f-origin',p?.origin);v('f-variety',p?.variety);v('f-texture',p?.texture);v('f-taste',p?.taste);v('f-storage',p?.storage);
  $('f-active').checked=p?p.active!==false:true;fimgs=[...(p?.images||[])];drawI();$('ov').classList.remove('hide');document.body.style.overflow='hidden'}
function closeForm(){$('ov').classList.add('hide');document.body.style.overflow=''}
$('addBtn').onclick=()=>openForm(null);$('cancelBtn').onclick=closeForm;$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeForm()});
function drawI(){$('imgs').innerHTML=fimgs.map((s,i)=>`<div class="im"><img src="${esc(s)}" alt=""><button data-rm="${i}">✕</button></div>`).join('')}
$('imgs').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){fimgs.splice(+b.dataset.rm,1);drawI()}});
function compress(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.74))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
$('file').onchange=async e=>{for(const f of e.target.files){if(fimgs.length>=4){toast('Maximum 4 photos');break}try{fimgs.push(await compress(f))}catch{toast('Photo read nahi hui')}}e.target.value='';drawI()};
$('saveBtn').onclick=async()=>{
  const name=$('f-name').value.trim(),n=x=>{const v=parseFloat($(x).value);return v>0?v:0},prices={'250g':n('f-p250'),'500g':n('f-p500'),'1kg':n('f-p1')};
  if(!name){toast('Product ka naam daalo');return}
  if(!prices['250g']&&!prices['500g']&&!prices['1kg']){toast('Kam se kam ek pack size ka price daalo');return}
  if(fimgs.join('').length>850000){toast('Photos bahut bhari hain, kam ya chhoti photos lo');return}
  const sv=$('f-stock').value.trim(),t=id=>$(id).value.trim();
  const data={name,category:$('f-cat').value,desc:t('f-desc'),prices,stock:sv===''?null:Math.max(0,parseInt(sv)),origin:t('f-origin'),variety:t('f-variety'),texture:t('f-texture'),taste:t('f-taste'),storage:t('f-storage'),images:fimgs,active:$('f-active').checked};
  $('saveBtn').disabled=true;
  try{if(editId)await setDoc(doc(db,'products',editId),data,{merge:true});else{data.order=prods.length?Math.max(...prods.map(x=>x.order||0))+1:1;await addDoc(PC,data)}toast('✅ Saved');closeForm();load()}catch(e){toast('Error: '+e.message)}
  $('saveBtn').disabled=false;
};
</script>
</body>
</html>
